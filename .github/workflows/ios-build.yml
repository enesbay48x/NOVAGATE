name: NOVAGATE iOS IPA Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7
        run: |
          GODOT_VERSION="4.7"
          curl --fail --location --retry 3 -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip -d godot
          chmod +x godot/Godot_v${GODOT_VERSION}-stable_macos.universal
          echo "GODOT_PATH=$PWD/godot/Godot_v${GODOT_VERSION}-stable_macos.universal" >> $GITHUB_ENV

      - name: Download Godot 4.7 iOS export templates
        run: |
          GODOT_VERSION="4.7"
          curl --fail --location --retry 3 -o ios_template.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/ios_template.zip"
          curl --fail --location --retry 3 -o ios_debug_template.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/ios_debug_template.zip"
          mkdir -p ~/.local/share/godot/export_templates/
          unzip -o -q ios_template.zip -d ~/.local/share/godot/export_templates/
          unzip -o -q ios_debug_template.zip -d ~/.local/share/godot/export_templates/

      - name: Export iOS Xcode project with Godot
        run: |
          $GODOT_PATH --headless --export-release "iOS" export/ios/NOVAGATE.xcodeproj

      - name: Verify Xcode availability
        run: |
          xcodebuild -version

      - name: Build IPA with Xcode
        run: |
          cd export/ios
          xcodebuild -project NOVAGATE.xcodeproj \
            -scheme NOVAGATE \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ../build/NOVAGATE.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p ../build/ios
          xcodebuild -exportArchive \
            -archivePath ../build/NOVAGATE.xcarchive \
            -exportPath ../build/ios \
            -exportOptionsPlist ExportOptions.plist \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO || true

      - name: List build output
        run: |
          ls -la build/ios/ 2>/dev/null || echo "No IPA output directory found"
          find build -name "*.ipa" 2>/dev/null || echo "No .ipa file found"

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NOVAGATE-iOS-IPA
          path: build/ios/NOVAGATE.ipa
          retention-days: 90
