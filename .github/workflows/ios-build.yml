name: iOS Build (NOVAGATE)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  ios-export:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2 editor (macOS)
        run: |
          cd "$RUNNER_TEMP"
          curl -L --fail -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip"
          unzip -q godot.zip
          sudo xattr -dr com.apple.quarantine Godot.app || true
          echo "GODOT=$RUNNER_TEMP/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Install export templates (4.7.2-stable)
        run: |
          cd "$RUNNER_TEMP"
          curl -L --fail -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          unzip -q templates.tpz
          cp -R templates/* "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable/"

      - name: Import project assets
        run: |
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" --import

      - name: Create temporary iOS icons
        run: |
          mkdir -p icons
          B64='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='
          for s in icon_1024x1024 icon_1024x1024_dark icon_1024x1024_tinted ios_128x128 ios_136x136 ios_192x192 ipad_152x152 ipad_167x167 iphone_120x120 iphone_180x180 notification_114x114 notification_40x40 notification_60x60 notification_76x76 settings_58x58 settings_87x87 spotlight_120x120 spotlight_80x80; do
            printf '%s' "$B64" | base64 -d > "icons/$s.png"
          done

      - name: Export iOS Xcode project (official Godot method)
        run: |
          set -o pipefail
          mkdir -p build
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" --export-release "iOS" build/NOVAGATE.ipa 2>&1 | tee export.log
          test -f build/NOVAGATE.xcodeproj/project.pbxproj

      - name: Build unsigned .app with xcodebuild
        run: |
          set -o pipefail
          xcodebuild \
            -project build/NOVAGATE.xcodeproj \
            -scheme NOVAGATE \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/NOVAGATE.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" | tee xcodebuild.log

      - name: Package unsigned IPA
        run: |
          APP="build/NOVAGATE.xcarchive/Products/Applications/NOVAGATE.app"
          test -d "$APP"
          rm -rf build/Payload build/NOVAGATE_unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/NOVAGATE.app
          cd build
          zip -qry NOVAGATE_unsigned.ipa Payload
          rm -rf Payload NOVAGATE.xcarchive
          ls -lh NOVAGATE_unsigned.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVAGATE_unsigned_ipa
          path: build/NOVAGATE_unsigned.ipa
          if-no-files-found: error

      - name: Upload Xcode project artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVAGATE_xcode_project
          path: build/
          if-no-files-found: error
