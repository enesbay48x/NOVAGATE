name: iOS Unsigned IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Godot 4.6.2 macOS editor
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable/Godot_v4.6.2-stable_macos.universal.zip"
          unzip -o -q godot.zip -d /Applications

      - name: Install iOS export templates
        run: |
          curl -fL -o export_templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable/Godot_v4.6.2-stable_export_templates.tpz"
          unzip -t export_templates.tpz > /dev/null
          mkdir -p /tmp/godot_templates
          unzip -o -q export_templates.tpz -d /tmp/godot_templates
          IOS_ZIP=$(find /tmp/godot_templates -name "ios.zip" | head -1)
          if [ -z "$IOS_ZIP" ]; then
            echo "::error::No ios.zip found in Godot 4.6.2-stable export templates archive"
            exit 1
          fi
          TEMPL_DIR="$HOME/Library/Application Support/Godot/export_templates/4.6.2.stable"
          mkdir -p "$TEMPL_DIR"
          cp "$IOS_ZIP" "$TEMPL_DIR/ios.zip"

      - name: Import assets (Godot headless)
        run: |
          GODOT_BIN=$(ls /Applications/Godot*.app/Contents/MacOS/Godot 2>/dev/null | head -1)
          if [ -z "$GODOT_BIN" ]; then
            GODOT_BIN=$(find /Applications -maxdepth 2 -name "Godot" -type f -executable 2>/dev/null | head -1)
          fi
          echo "Using Godot binary: $GODOT_BIN"
          "$GODOT_BIN" --headless --path . --import

      - name: Export iOS Xcode project (Godot does not sign during project generation)
        run: |
          mkdir -p export/ios
          GODOT_BIN=$(ls /Applications/Godot*.app/Contents/MacOS/Godot 2>/dev/null | head -1)
          if [ -z "$GODOT_BIN" ]; then
            GODOT_BIN=$(find /Applications -maxdepth 2 -name "Godot" -type f -executable 2>/dev/null | head -1)
          fi
          echo "Using Godot binary: $GODOT_BIN"
          "$GODOT_BIN" --headless --path . --export-release "iOS" "export/ios/NOVAGATE.xcodeproj"

      - name: Disable code signing in Xcode project (pbxproj)
        run: |
          PBXPROJ="export/ios/NOVAGATE.xcodeproj/project.pbxproj"
          if [ ! -f "$PBXPROJ" ]; then
            echo "::error::project.pbxproj not found in exported Xcode project"
            exit 1
          fi
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_IDENTITY = .*;/CODE_SIGN_IDENTITY = "";/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_STYLE = .*;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = .*;/PROVISIONING_PROFILE_SPECIFIER = "";/g' "$PBXPROJ"
          sed -i '' 's/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ"
          echo "Code signing disabled in Xcode project"

      - name: Build unsigned .app with xcodebuild
        run: |
          cd export/ios
          # Deterministik ç˙ıkış klasoru: SYMROOT ile build ciktisini belli bir yere topla
          rm -rf ../build
          mkdir -p ../build
          xcodebuild -project NOVAGATE.xcodeproj -scheme NOVAGATE -configuration Release -sdk iphoneos \
            -derivedDataPath ../build/derived \
            SYMROOT=../build/symroot \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM=""
          # Build agacinda tum .app dosyalarini ara (recursive, derinlik sansirli)
          BUILT_APP=$(find "$PWD/../build" -name "NOVAGATE.app" -maxdepth 15 2>/dev/null | head -1)
          if [ -z "$BUILT_APP" ]; then
            # Proje ismiyle eslesmeyen ama generic .app varsa onlari da listele
            echo "::warning::NOVAGATE.app bulunamadi, tum .app dosyalari listeleniyor:"
            find "$PWD/../build" -name "*.app" -maxdepth 15 2>/dev/null || true
            echo "=== Tum dosyalar build altinda ==="
            find "$PWD/../build" -maxdepth 15 -type f 2>/dev/null | head -80 || true
            echo "::error::No NOVAGATE.app built by xcodebuild under $PWD/../build"
            exit 1
          fi
          echo "Built app found: $BUILT_APP"
          # Repo kokuya kopyala (her adim repo kokusunda basladigi icin $PWD/../ = repo kokudur)
          rm -rf "$PWD/../NOVAGATE.app"
          cp -R "$BUILT_APP" "$PWD/../NOVAGATE.app"
          echo "Copied to: $PWD/../NOVAGATE.app"
          echo "app_path=$PWD/../NOVAGATE.app" >> $GITHUB_OUTPUT

      - name: Verify real .app bundle
        run: |
          if [ ! -d "NOVAGATE.app" ]; then
            echo "::error::NOVAGATE.app not found at repo root"
            echo "=== Files at repo root ==="
            ls -la
            exit 1
          fi
          if [ ! -f "NOVAGATE.app/Info.plist" ]; then
            echo "::error::NOVAGATE.app/Info.plist missing - not a real app bundle"
            exit 1
          fi
          echo "=== .app bundle contents ==="
          find NOVAGATE.app -maxdepth 4 -type f | sort | head -60
          echo "Verified: NOVAGATE.app is a real iOS app bundle"

      - name: Package unsigned .app into IPA
        run: |
          if [ ! -d "NOVAGATE.app" ]; then
            echo "::error::Missing NOVAGATE.app"
            exit 1
          fi
          rm -rf Payload NOVAGATE.ipa
          mkdir -p Payload
          cp -R NOVAGATE.app Payload/NOVAGATE.app
          zip -r NOVAGATE.ipa Payload/
          echo "=== IPA contents ==="
          unzip -l NOVAGATE.ipa
          if ! unzip -t NOVAGATE.ipa > /dev/null; then
            echo "::error::IPA zip integrity check failed"
            exit 1
          fi
          if ! unzip -l NOVAGATE.ipa | grep -q "Payload/NOVAGATE.app/Info.plist"; then
            echo "::error::IPA does not contain Payload/NOVAGATE.app/Info.plist"
            exit 1
          fi
          echo "ipa_path=$(pwd)/NOVAGATE.ipa" >> $GITHUB_OUTPUT
          echo "ipa_name=NOVAGATE.ipa" >> $GITHUB_OUTPUT
          echo "Unsigned IPA created: NOVAGATE.ipa"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVAGATE-ipa
          path: NOVAGATE.ipa
          retention-days: 7
