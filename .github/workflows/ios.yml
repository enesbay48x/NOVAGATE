name: iOS Unsigned IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 macOS editor
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip"
          unzip -o -q godot.zip -d /Applications

      - name: Install iOS export templates
        run: |
          curl -L -o ios_templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          mkdir -p /tmp/godot_templates
          unzip -o -q ios_templates.tpz -d /tmp/godot_templates
          echo "=== Template archive contents ==="
          find /tmp/godot_templates -type f | sort
          IOS_ZIP=$(find /tmp/godot_templates -name "ios.zip" | head -1)
          echo "Found iOS template: $IOS_ZIP"
          TEMPL_DIR="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPL_DIR"
          cp "$IOS_ZIP" "$TEMPL_DIR/ios.zip"
          echo "Copied to: $TEMPL_DIR/ios.zip"

      - name: Import assets (Godot headless)
        run: |
          GODOT_BIN=$(ls /Applications/Godot*.app/Contents/MacOS/Godot 2>/dev/null | head -1)
          if [ -z "$GODOT_BIN" ]; then
            GODOT_BIN=$(find /Applications -maxdepth 2 -name "Godot" -type f -executable 2>/dev/null | head -1)
          fi
          echo "Using Godot binary: $GODOT_BIN"
          "$GODOT_BIN" --headless --path . --import

      - name: Export iOS Xcode project
        run: |
          mkdir -p export/ios
          GODOT_BIN=$(ls /Applications/Godot*.app/Contents/MacOS/Godot 2>/dev/null | head -1)
          if [ -z "$GODOT_BIN" ]; then
            GODOT_BIN=$(find /Applications -maxdepth 2 -name "Godot" -type f -executable 2>/dev/null | head -1)
          fi
          echo "Using Godot binary: $GODOT_BIN"
          "$GODOT_BIN" --headless --path . --export-release "iOS" "export/ios/NOVAGATE.xcodeproj"

      - name: Build unsigned .ipa with xcodebuild
        run: |
          cd export/ios
          xcodebuild -project NOVAGATE.xcodeproj -scheme NOVAGATE -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO OTHER_LDFLAGS="-framework Metal -framework QuartzCore -framework CoreGraphics -framework Foundation -framework CoreMedia -framework CoreVideo -framework AVFoundation -framework GameKit" -derivedDataPath xcode-build
          mkdir -p Payload
          cp -R "xcode-build/Build/Products/Release-iphoneos/NOVAGATE.app" Payload/
          zip -r ../../NOVAGATE.ipa Payload/

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVAGATE-ipa
          path: NOVAGATE.ipa
          retention-days: 7
