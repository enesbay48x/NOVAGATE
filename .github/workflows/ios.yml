name: iOS Unsigned IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Godot 4.6.2 macOS editor
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable/Godot_v4.6.2-stable_macos.universal.zip"
          unzip -o -q godot.zip -d /Applications

      - name: Install iOS export templates
        run: |
          # Godot 4.6.2-stable için resmi export templates paketi (tpz = Godot Template Package, ZIP tabanlı)
          # ios_template.zip bu release'te yok; doğru dosya Godot_v4.6.2-stable_export_templates.tpz'dır
          curl -fL -o export_templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable/Godot_v4.6.2-stable_export_templates.tpz"

          # Arşivin geçerli bir ZIP/tpz olduğunu doğrula; değilse işlemi durdur
          unzip -t export_templates.tpz > /dev/null

          mkdir -p /tmp/godot_templates
          unzip -o -q export_templates.tpz -d /tmp/godot_templates

          echo "=== Template archive contents ==="
          find /tmp/godot_templates -type f | sort

          # Arşiv içinde iOS template zip'ini bul
          IOS_ZIP=$(find /tmp/godot_templates -name "ios.zip" | head -1)
          if [ -z "$IOS_ZIP" ]; then
            echo "::error::No ios.zip found in Godot 4.6.2-stable export templates archive"
            exit 1
          fi

          echo "Found iOS template: $IOS_ZIP"
          TEMPL_DIR="$HOME/Library/Application Support/Godot/export_templates/4.6.2.stable"
          mkdir -p "$TEMPL_DIR"
          cp "$IOS_ZIP" "$TEMPL_DIR/ios.zip"
          echo "Copied to: $TEMPL_DIR/ios.zip"

      - name: Import assets (Godot headless)
        run: |
          GODOT_BIN=$(ls /Applications/Godot*.app/Contents/MacOS/Godot 2>/dev/null | head -1)
          if [ -z "$GODOT_BIN" ]; then
            GODOT_BIN=$(find /Applications -maxdepth 2 -name "Godot" -type f -executable 2>/dev/null | head -1)
          fi
          echo "Using Godot binary: $GODOT_BIN"
          "$GODOT_BIN" --headless --path . --import

      - name: Export iOS Xcode project
        run: |
          mkdir -p export/ios
          GODOT_BIN=$(ls /Applications/Godot*.app/Contents/MacOS/Godot 2>/dev/null | head -1)
          if [ -z "$GODOT_BIN" ]; then
            GODOT_BIN=$(find /Applications -maxdepth 2 -name "Godot" -type f -executable 2>/dev/null | head -1)
          fi
          echo "Using Godot binary: $GODOT_BIN"
          "$GODOT_BIN" --headless --path . --export-release "iOS" "export/ios/NOVAGATE.xcodeproj"

      - name: Build unsigned .ipa with xcodebuild
        run: |
          cd export/ios
          xcodebuild -project NOVAGATE.xcodeproj -scheme NOVAGATE -configuration Release -sdk iphoneos -archivePath ../build/NOVAGATE.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          xcodebuild -exportArchive -archivePath ../build/NOVAGATE.xcarchive -exportPath ../build/ios -exportOptionsPlist ExportOptions.plist CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir -p Payload
          cp -R "../build/ios/NOVAGATE.app" Payload/
          zip -r ../../NOVAGATE.ipa Payload/

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVAGATE-ipa
          path: NOVAGATE.ipa
          retention-days: 7
