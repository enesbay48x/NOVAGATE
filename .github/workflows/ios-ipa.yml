name: iOS IPA Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-ios-ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      GODOT_VERSION: "4.7-stable"
      GODOT_DOWNLOAD_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_macos.universal.zip"
      IOS_TEMPLATES_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz"
      TEMPLATES_DIR: "$HOME/Library/Application Support/Godot/export_templates/4.7.stable"
      EXPORT_DIR: "export/ios"
      XCODEPROJ_PATH: "export/ios/NOVAGATE.xcodeproj"
      APPLE_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean up old artifacts (storage quota management)
        run: |
          set +e
          echo "Cleaning up artifacts older than 1 day..."
          gh api repos/${{ github.repository }}/actions/artifacts --paginate 2>/dev/null | \
            jq -r '.artifacts[] | select(.expired_at == null and (.created_at | fromdate < (now - 86400))) | .id' | \
            while read -r artifact_id; do
              echo "Deleting old artifact ID: ${artifact_id}"
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${artifact_id}" 2>/dev/null || true
            done
          echo "Cleanup complete"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify environment
        run: |
          set -euo pipefail
          echo "Runner: $(uname -a)"
          echo "Xcode: $(xcodebuild -version | head -1)"
          echo "GitHub Actions: OK"

      - name: Install Godot 4.7-stable macOS editor
        run: |
          set -euo pipefail
          echo "Downloading Godot ${GODOT_VERSION} macOS editor..."
          curl -fL -o /tmp/godot.zip "${GODOT_DOWNLOAD_URL}"
          unzip -o -q /tmp/godot.zip -d /Applications
          GODOT_BIN=$(ls /Applications/Godot*.app/Contents/MacOS/Godot 2>/dev/null | head -1)
          if [ -z "$GODOT_BIN" ]; then
            echo "::error::Godot binary not found in /Applications"
            exit 1
          fi
          echo "Godot binary: $GODOT_BIN"
          "$GODOT_BIN" --version
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Install iOS export templates
        run: |
          set -euo pipefail
          echo "Downloading iOS export templates for ${GODOT_VERSION}..."
          curl -fL -o /tmp/ios_templates.zip "${IOS_TEMPLATES_URL}"
          mkdir -p "${TEMPLATES_DIR}"
          unzip -o -q /tmp/ios_templates.zip -d /tmp/ios_templates_extract
          IOS_ZIP=$(find /tmp/ios_templates_extract -name "ios.zip" | head -1)
          if [ -z "$IOS_ZIP" ]; then
            echo "::error::ios.zip not found in iOS templates archive"
            exit 1
          fi
          cp "$IOS_ZIP" "${TEMPLATES_DIR}/ios.zip"
          echo "Installed iOS templates to ${TEMPLATES_DIR}/ios.zip"
      - name: Import assets (Godot headless)
        run: |
          set -euo pipefail
          echo "Running Godot headless import..."
          "$GODOT_BIN" --headless --path . --import
          echo "Godot import completed successfully"

      - name: Patch export_presets.cfg with CI signing values
        run: |
          set -euo pipefail
          echo "Patching export_presets.cfg for CI signing (secrets only, not committed)..."

          sed -i '' 's/application\/app_store_team_id="[^"]*"/application\/app_store_team_id="'"${APPLE_TEAM_ID}"'"/' export_presets.cfg
          sed -i '' 's/application\/code_sign_identity_release="-"/application\/code_sign_identity_release="Apple Distribution"/' export_presets.cfg
          sed -i '' 's/application\/export_method_release=[0-9]/application\/export_method_release=0/' export_presets.cfg
          sed -i '' 's/application\/provisioning_profile_specifier_release="[^"]*"/application\/provisioning_profile_specifier_release=""/' export_presets.cfg

          echo "Patched export_presets.cfg values:"
          grep 'application/app_store_team_id=' export_presets.cfg
          grep 'application/code_sign_identity_release=' export_presets.cfg
          grep 'application/export_method_release=' export_presets.cfg
          grep 'application/provisioning_profile_specifier_release=' export_presets.cfg

      - name: Create temporary keychain and import Apple certificate
        if: env.APPLE_CERT_P12_BASE64 != '' && env.APPLE_CERT_PASSWORD != ''
        run: |
          set -euo pipefail
          KEYCHAIN_NAME="build-keychain"
          KEYCHAIN_PATH="$HOME/Library/Keychains/${KEYCHAIN_NAME}-db"

          echo "Creating temporary keychain..."
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_NAME}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_NAME}"
          security set-keychain-settings -t 7200 -u -l "${KEYCHAIN_NAME}"
          security default-keychain -s "${KEYCHAIN_NAME}"

          echo "Importing Apple certificate (P12)..."
          echo "${APPLE_CERT_P12_BASE64}" | base64 -D -o /tmp/cert.p12
          security import /tmp/cert.p12 -k "${KEYCHAIN_NAME}" -P "${APPLE_CERT_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          rm -f /tmp/cert.p12

          echo "Keychain created and certificate imported"

      - name: Install provisioning profile
        if: env.APPLE_PROVISION_PROFILE_BASE64 != ''
        run: |
          set -euo pipefail
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "${PROFILES_DIR}"

          echo "${APPLE_PROVISION_PROFILE_BASE64}" | base64 -D -o /tmp/provisioning.mobileprovision

          PROFILE_UUID=$(security cms -D -i /tmp/provisioning.mobileprovision 2>/dev/null | grep -A1 'UUID' | grep -oE '[A-F0-9-]{36}' | head -1 || echo "unknown")
          PROFILE_NAME=$(security cms -D -i /tmp/provisioning.mobileprovision 2>/dev/null | grep -A1 'Name' | grep -oE '<string>[^<]*</string>' | head -1 | sed 's/<string>\(.*\)<\/string>/\1/' || echo "unknown")

          echo "Provisioning profile UUID: ${PROFILE_UUID}"
          echo "Provisioning profile name: ${PROFILE_NAME}"

          cp /tmp/provisioning.mobileprovision "${PROFILES_DIR}/"
          rm -f /tmp/provisioning.mobileprovision
          echo "Provisioning profile installed"

      - name: Export iOS Xcode project with Godot
        run: |
          set -euo pipefail
          echo "Exporting iOS Xcode project..."
          mkdir -p "${EXPORT_DIR}"
          rm -rf "${EXPORT_DIR:?}"/*

          "$GODOT_BIN" --headless --path . --export-release "iOS" "${XCODEPROJ_PATH}"
          export_code=$?

          if [ $export_code -ne 0 ]; then
            echo "::error::Godot export failed with exit code ${export_code}"
            exit $export_code
          fi

          if [ ! -d "${XCODEPROJ_PATH}" ]; then
            echo "::error::Xcode project not found at ${XCODEPROJ_PATH}"
            exit 1
          fi

          echo "Xcode project created: ${XCODEPROJ_PATH}"
          echo "XCODEPROJ_PATH=${XCODEPROJ_PATH}" >> "$GITHUB_ENV"

      - name: Detect Xcode scheme name
        run: |
          set -euo pipefail
          echo "Detecting Xcode scheme..."
          cd "${EXPORT_DIR}"
          SCHEME_NAME=$(xcodebuild -list -json 2>/dev/null | grep -A5 '"schemes"' | grep -oE '"[^"]+"' | head -1 | tr -d '"')
          if [ -z "$SCHEME_NAME" ]; then
            echo "::error::Could not detect Xcode scheme name"
            exit 1
          fi
          echo "Xcode scheme: ${SCHEME_NAME}"
          echo "SCHEME_NAME=${SCHEME_NAME}" >> "$GITHUB_ENV"
          cd "${GITHUB_WORKSPACE}"

      - name: Build iOS archive with xcodebuild (manual signing)
        run: |
          set -euo pipefail
          echo "Building iOS archive..."

          cd "${EXPORT_DIR}"

          if [ -n "${APPLE_CERT_P12_BASE64}" ] && [ -n "${APPLE_CERT_PASSWORD}" ] && [ -n "${APPLE_PROVISION_PROFILE_BASE64}" ]; then
            EXPORT_METHOD="app-store"
          else
            EXPORT_METHOD="ad-hoc"
          fi
          echo "Export method: ${EXPORT_METHOD}"

          cat > ExportOptions.plist <<PLIST_EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${EXPORT_METHOD}</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.benim.darkorbit3d</key>
                  <string>${APPLE_TEAM_ID}</string>
              </dict>
          </dict>
          </plist>
          PLIST_EOF

          echo "ExportOptions.plist created (method: ${EXPORT_METHOD}, teamID: ${APPLE_TEAM_ID})"

          echo "Running xcodebuild archive..."
          xcodebuild -project NOVAGATE.xcodeproj -scheme "${SCHEME_NAME}" -configuration Release -sdk iphoneos \
            -archivePath "${GITHUB_WORKSPACE}/build/NOVAGATE.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive

          if [ ! -d "${GITHUB_WORKSPACE}/build/NOVAGATE.xcarchive" ]; then
            echo "::error::Xcode archive not created"
            exit 1
          fi

          echo "Archive created successfully"

          echo "Exporting IPA from archive..."
          xcodebuild -exportArchive \
            -archivePath "${GITHUB_WORKSPACE}/build/NOVAGATE.xcarchive" \
            -exportPath "${GITHUB_WORKSPACE}/build/ios-export" \
            -exportOptionsPlist "${EXPORT_DIR}/ExportOptions.plist"

          if [ ! -d "${GITHUB_WORKSPACE}/build/ios-export" ]; then
            echo "::error::IPA export directory not created"
            exit 1
          fi

          cd "${GITHUB_WORKSPACE}"
          echo "XCODEBUILD_DONE=true" >> "$GITHUB_ENV"

      - name: Package and verify IPA
        run: |
          set -euo pipefail

          if [ ! -d "${GITHUB_WORKSPACE}/build/ios-export" ]; then
            echo "::error::No ios-export directory found"
            exit 1
          fi

          IPA_FILE=$(find "${GITHUB_WORKSPACE}/build/ios-export" -name "*.ipa" | head -1)
          if [ -z "$IPA_FILE" ]; then
            echo "::error::No .ipa file found in export directory"
            exit 1
          fi

          echo "Found IPA: ${IPA_FILE}"
          echo "=== IPA contents ==="
          unzip -l "${IPA_FILE}"

          if ! unzip -t "${IPA_FILE}" > /dev/null; then
            echo "::error::IPA zip integrity check failed"
            exit 1
          fi

          if ! unzip -l "${IPA_FILE}" | grep -q "Payload/.*Info.plist"; then
            echo "::error::IPA does not contain Payload/*.app/Info.plist"
            exit 1
          fi

          IPA_SIZE=$(stat -f%z "${IPA_FILE}")
          echo "IPA size: ${IPA_SIZE} bytes"
          echo "IPA_FILE=${IPA_FILE}" >> "$GITHUB_ENV"
          echo "IPA_SIZE=${IPA_SIZE}" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: NOVAGATE-ios-ipa
          path: ${{ env.IPA_FILE }}
          retention-days: 1

      - name: Cleanup temporary keychain
        if: always()
        run: |
          set +e
          KEYCHAIN_NAME="build-keychain"
          if security list-keychains 2>/dev/null | grep -q "${KEYCHAIN_NAME}"; then
            echo "Deleting temporary keychain..."
            security delete-keychain "${KEYCHAIN_NAME}" 2>/dev/null || true
            echo "Keychain deleted"
          fi