name: iOS IPA Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-ios-ipa:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Godot 4.7-stable macOS editor
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_macos.universal.zip"
          unzip -o -q godot.zip -d /Applications

      - name: Install iOS export templates
        run: |
          curl -fL -o export_templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz"
          unzip -t export_templates.tpz > /dev/null
          mkdir -p /tmp/godot_templates
          unzip -o -q export_templates.tpz -d /tmp/godot_templates
          IOS_ZIP=$(find /tmp/godot_templates -name "ios.zip" | head -1)
          if [ -z "$IOS_ZIP" ]; then
            echo "::error::No ios.zip found in Godot 4.7-stable export templates archive"
            exit 1
          fi
          TEMPL_DIR="$HOME/Library/Application Support/Godot/export_templates/4.7.stable"
          mkdir -p "$TEMPL_DIR"
          cp "$IOS_ZIP" "$TEMPL_DIR/ios.zip"
          echo "Copied to: $TEMPL_DIR/ios.zip"

      - name: Check for Apple signing secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.APPLE_CERT_P12_BASE64 }}" ] && [ -n "${{ secrets.APPLE_CERT_PASSWORD }}" ] && [ -n "${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}" ] && [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          fi

      - name: Import assets (Godot headless)
        run: |
          GODOT_BIN=$(ls /Applications/Godot*.app/Contents/MacOS/Godot 2>/dev/null | head -1)
          if [ -z "$GODOT_BIN" ]; then
            GODOT_BIN=$(find /Applications -maxdepth 2 -name "Godot" -type f -executable 2>/dev/null | head -1)
          fi
          echo "Using Godot binary: $GODOT_BIN"
          "$GODOT_BIN" --headless --path . --import

      - name: Configure iOS export presets (team id from secrets only)
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          sed -i '' 's/application\/app_store_team_id="[^"]*"/application\/app_store_team_id="'"${{ secrets.APPLE_TEAM_ID }}"'"/' export_presets.cfg
          sed -i '' 's/application\/code_sign_identity_release="-"/application\/code_sign_identity_release="Apple Distribution"/' export_presets.cfg
          echo "Team id configured in export_presets.cfg (from secret, not committed)"

      - name: Export iOS Xcode project (Godot does not sign during project generation)
        run: |
          mkdir -p export/ios
          GODOT_BIN=$(ls /Applications/Godot*.app/Contents/MacOS/Godot 2>/dev/null | head -1)
          if [ -z "$GODOT_BIN" ]; then
            GODOT_BIN=$(find /Applications -maxdepth 2 -name "Godot" -type f -executable 2>/dev/null | head -1)
          fi
          echo "Using Godot binary: $GODOT_BIN"
          "$GODOT_BIN" --headless --path . --export-release "iOS" "export/ios/NOVAGATE.xcodeproj"

      - name: Disable code signing in Xcode project (pbxproj)
        run: |
          PBXPROJ="export/ios/NOVAGATE.xcodeproj/project.pbxproj"
          if [ ! -f "$PBXPROJ" ]; then
            echo "::error::project.pbxproj not found in exported Xcode project"
            exit 1
          fi
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_IDENTITY = .*;/CODE_SIGN_IDENTITY = "";/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_STYLE = .*;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = .*;/PROVISIONING_PROFILE_SPECIFIER = "";/g' "$PBXPROJ"
          sed -i '' 's/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ"
          echo "Code signing disabled in Xcode project"

      - name: Build unsigned .app with xcodebuild
        run: |
          cd export/ios
          rm -rf ../build
          mkdir -p ../build
          xcodebuild -project NOVAGATE.xcodeproj -scheme NOVAGATE -configuration Release -sdk iphoneos \
            -derivedDataPath ../build/derived \
            SYMROOT=../build/symroot \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM=""

          echo "=== CURRENT DIRECTORY ==="
          pwd
          echo "=== REPOSITORY ROOT ==="
          ls -la "$PWD/.."
          echo "=== ALL APP BUNDLES UNDER REPO ==="
          find "$PWD/.." -type d -name "*.app" -maxdepth 10 2>/dev/null || true
          echo "=== BUILD DIRECTORIES ==="
          find "$PWD/.." -maxdepth 5 -type d \( -name "build" -o -name "Build" \) -print 2>/dev/null || true
          echo "=== SYMROOT CONTENTS ==="
          SYMROOT_DIR="$PWD/../build/symroot"
          if [ -d "$SYMROOT_DIR" ]; then
            find "$SYMROOT_DIR" -maxdepth 6 -print 2>/dev/null || true
          else
            echo "SYMROOT directory does not exist: $SYMROOT_DIR"
          fi

          APP_PATH=$(find "$PWD/../build" -type d -name "NOVAGATE.app" -maxdepth 15 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$PWD/../build" -type d -name "*.app" -maxdepth 15 2>/dev/null | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found under $PWD/../build after xcodebuild"
            exit 1
          fi

          echo "=== REAL .app FOUND ==="
          echo "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Set iOS landscape orientation in .app bundle
        run: |
          if [ -z "$APP_PATH" ]; then
            echo "::error::APP_PATH environment variable is empty"
            exit 1
          fi
          INFO_PLIST="$APP_PATH/Info.plist"
          if [ -f "$INFO_PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$INFO_PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$INFO_PLIST"
            /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" "$INFO_PLIST"
            /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" "$INFO_PLIST"
            echo "Landscape orientation set in $INFO_PLIST"
          else
            echo "Info.plist not found in .app bundle: $APP_PATH"
          fi

      - name: Verify real .app bundle
        run: |
          if [ -z "$APP_PATH" ]; then
            echo "::error::APP_PATH environment variable is empty"
            exit 1
          fi
          echo "Verifying APP_PATH: $APP_PATH"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::APP_PATH is not a directory: $APP_PATH"
            exit 1
          fi
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "::error::APP_PATH does not contain Info.plist: $APP_PATH"
            exit 1
          fi
          echo "=== .app bundle contents ==="
          find "$APP_PATH" -maxdepth 4 -type f | sort | head -60
          echo "Verified: $APP_PATH is a real iOS app bundle"

      - name: Package unsigned .app into IPA
        run: |
          if [ -z "$APP_PATH" ]; then
            echo "::error::APP_PATH environment variable is empty"
            exit 1
          fi
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Missing .app bundle at: $APP_PATH"
            exit 1
          fi
          rm -rf Payload NOVAGATE-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/NOVAGATE.app
          zip -r NOVAGATE-unsigned.ipa Payload/

          IPA_PATH="$PWD/NOVAGATE-unsigned.ipa"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

          if [ ! -f "$IPA_PATH" ]; then
            echo "::error::IPA file was not created: $IPA_PATH"
            exit 1
          fi
          echo "=== IPA contents ==="
          unzip -l "$IPA_PATH"
          if ! unzip -t "$IPA_PATH" > /dev/null; then
            echo "::error::IPA zip integrity check failed"
            exit 1
          fi
          if ! unzip -l "$IPA_PATH" | grep -q "Payload/NOVAGATE.app/Info.plist"; then
            echo "::error::IPA does not contain Payload/NOVAGATE.app/Info.plist"
            exit 1
          fi
          echo "Unsigned IPA created: $IPA_PATH"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVAGATE-unsigned-ipa
          path: ${{ env.IPA_PATH }}
          retention-days: 7

      - name: Import Apple certificate and provisioning profile
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          security create-keychain -p build-keychain build.keychain
          security unlock-keychain -p build-keychain build.keychain
          security set-keychain-settings -t 7200 -l build.keychain
          security default-keychain -s build.keychain

          echo "${{ secrets.APPLE_CERT_P12_BASE64 }}" | base64 -d > cert.p12
          security import cert.p12 -k build.keychain -P "${{ secrets.APPLE_CERT_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security

          echo "${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}" | base64 -d > provisioning.mobileprovision
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp provisioning.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"

          cat > export/ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTDs Property List 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.benim.darkorbit3d</key>
                  <string>${{ secrets.APPLE_TEAM_ID }}</string>
              </dict>
          </dict>
          </plist>
          EOF
          echo "Certificate and provisioning profile imported (secrets never logged)"

      - name: Build signed IPA (if secrets available)
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          cd export/ios
          xcodebuild -project NOVAGATE.xcodeproj -scheme NOVAGATE -configuration Release -sdk iphoneos -archivePath ../build/NOVAGATE.xcarchive archive \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER=""
          xcodebuild -exportArchive -archivePath ../build/NOVAGATE.xcarchive -exportPath ../build/ios -exportOptionsPlist ExportOptions.plist
          SIGNED_APP_PATH="$PWD/../build/ios/NOVAGATE.app"
          if [ ! -d "$SIGNED_APP_PATH" ]; then
            echo "::error::Signed .app not found at $SIGNED_APP_PATH"
            echo "=== Files under ../build/ios ==="
            find ../build/ios -maxdepth 5 -type f 2>/dev/null | head -50 || true
            exit 1
          fi
          rm -rf Payload NOVAGATE.ipa
          mkdir -p Payload
          cp -R "$SIGNED_APP_PATH" Payload/NOVAGATE.app
          zip -r ../../NOVAGATE.ipa Payload/
          SIGNED_IPA_PATH="$PWD/../../NOVAGATE.ipa"
          echo "SIGNED_IPA_PATH=$SIGNED_IPA_PATH" >> "$GITHUB_ENV"
          echo "=== Signed IPA contents ==="
          unzip -l "$SIGNED_IPA_PATH" | head -20

      - name: Upload signed IPA artifact
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NOVAGATE-signed-ipa
          path: ${{ env.SIGNED_IPA_PATH }}
          retention-days: 7

      - name: Collect IPA files for release
        if: startsWith(github.ref, 'refs/tags/')
        id: collect-ipa
        run: |
          FILES="NOVAGATE-unsigned.ipa"
          [ -f NOVAGATE.ipa ] && FILES="${FILES}"$'\n'"NOVAGATE.ipa"
          echo "ipa_files=${FILES}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release (tagged pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: NOVAGATE iOS ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.collect-ipa.outputs.ipa_files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
