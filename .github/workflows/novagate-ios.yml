# NovaGate iOS Build Workflow
# ⚠️ IMPORTANT: IPA export requires paid Apple Developer account ($99/year).
# Free Apple account supports direct device install via Xcode only.
# IPA export is NOT possible with free account.

name: NovaGate iOS Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7"
  PROJECT_NAME: "NovaGate"

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7
        run: |
          echo "📥 Downloading Godot 4.7..."
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_stable_macos.zip"
          unzip -q godot.zip -d /tmp/godot_build
          cp -R /tmp/godot_build/Godot.app /Applications/Godot.app
          echo "✅ Godot 4.7 installed"

      - name: Verify Godot version
        run: |
          /Applications/Godot.app/Contents/MacOS/Godot --version

      - name: Download Godot iOS Export Template
        run: |
          echo "📥 Downloading iOS Export Template..."
          curl -L -o ios_template.zip "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_stable_export_ios.tpz"
          mkdir -p ~/.local/share/godot/editor/templates/4.7/
          unzip -q ios_template.zip -d ~/.local/share/godot/editor/templates/4.7/ios
          echo "✅ iOS Export Template installed"

      - name: Verify iOS export preset in export_presets.cfg
        run: |
          echo "🔍 Checking iOS export preset in export_presets.cfg..."
          if ! grep -q 'name="iOS"' export_presets.cfg; then
            echo "❌ ERROR: iOS export preset not found in export_presets.cfg"
            exit 1
          fi
          echo "✅ iOS preset found in export_presets.cfg"

      - name: Export iOS project from Godot
        run: |
          echo "🎮 Exporting iOS project from Godot..."
          /Applications/Godot.app/Contents/MacOS/Godot \
            --headless \
            --path . \
            --export "iOS" \
            ./build/ios_export/Novagate.xcodeproj

          if [ ! -d "./build/ios_export/Novagate.xcodeproj" ]; then
            echo "❌ ERROR: Godot iOS export failed!"
            echo "🔍 Created files in build/ios_export/:"
            ls -la ./build/ios_export/ 2>/dev/null || echo "(directory does not exist)"
            exit 1
          fi
          echo "✅ Godot iOS project exported successfully"

      - name: Discover Xcode scheme name
        run: |
          echo "🔍 Discovering Xcode scheme name..."
          cd ./build/ios_export
          SCHEME_NAME=$(grep -o '"[^"]*" = {isa = PBXNativeTarget;' Novagate.xcodeproj/project.pbxproj | head -1 | sed 's/"//g' | sed 's/ = {isa = PBXNativeTarget;//')
          echo "📱 Discovered scheme: $SCHEME_NAME"
          
          if [ -z "$SCHEME_NAME" ]; then
            echo "❌ ERROR: Xcode scheme name not found!"
            exit 1
          fi
          echo "SCHEME_NAME=$SCHEME_NAME" >> $GITHUB_ENV

      - name: Xcode Archive
        run: |
          cd ./build/ios_export
          echo "🍎 Building Xcode archive..."

          xcodebuild -scheme "$SCHEME_NAME" -sdk iphoneos \
            -configuration Release \
            -archivePath ./Novagate.xcarchive \
            archive 2>&1 || {
            echo "❌ ERROR: Xcode archive failed!"
            exit 1
          }

          if [ ! -d "./Novagate.xcarchive" ]; then
            echo "❌ ERROR: Archive not created!"
            exit 1
          fi

          echo "✅ Xcode archive created successfully"

      - name: Export IPA (requires paid Apple Developer account)
        run: |
          cd ./build/ios_export

          cat > export_options.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>compileBitcode</key>
              <false/>
              <key>embedOnDemandResources</key>
              <false/>
              <key>stripSwiftSymbols</key>
              <false/>
              <key>teamID</key>
              <string></string>
          </dict>
          </plist>
          EOF

          echo "🍎 Exporting IPA..."
          xcodebuild -exportArchive \
            -archivePath ./Novagate.xcarchive \
            -exportPath ./export \
            -exportOptionsPlist ./export_options.plist 2>&1 || {
            echo "❌ ERROR: IPA export failed!"
            echo ""
            echo "💡 IMPORTANT: IPA export requires PAID Apple Developer account."
            echo "              Free Apple account supports direct device install via Xcode only."
            echo "              IPA export is NOT available with free account."
            echo ""
            echo "  To install on your iPhone without paid account:"
              echo "   1. Download the .xcarchive artifact from this workflow"
              echo "   2. Open in Xcode on macOS"
              echo "   3. Connect iPhone and select your device as run target"
              echo "   4. Press Run to install directly"
            exit 1
          }

          if [ ! -d "./export" ] || [ -z "$(ls ./export/*.ipa 2>/dev/null)" ]; then
            echo "❌ ERROR: IPA file not found after export!"
            echo "   IPA export requires paid Apple Developer account."
            exit 1
          fi

          echo "✅ IPA exported successfully!"
          ls -la ./export/*.ipa

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nova-gate-ios-ipa
          path: build/ios_export/export/*.ipa

      - name: Build Summary
        run: |
          echo ""
          echo "========================================"
          echo "NOVAGATE iOS BUILD RESULT"
          echo "========================================"
          echo "Project: NovaGate"
          echo "Godot: 4.7"
          echo "Target: iOS"
          echo ""
          echo "⚠️  IMPORTANT:"
          echo "  - IPA export requires PAID Apple Developer account ($99/year)."
          echo "  - Free Apple account: Direct device install via Xcode only."
          echo "  - IPA export is NOT available with free account."
          echo ""
          echo "  📱 To install on your iPhone with FREE account:"
          echo "   1. Download the .xcarchive artifact from this workflow run"
          echo "   2. Open in Xcode on macOS"
          echo "   3. Connect iPhone via USB and select it as run target"
          echo "   4. Click Run to install directly to your iPhone"
          echo ""
          echo "   OR use Sideloadly (Windows/Mac) with your Apple ID"
          echo "   - Sideloadly can install IPA without paid developer account"
          echo "   - Sideloadly uses your Apple ID to sign temporarily"
          echo "========================================"